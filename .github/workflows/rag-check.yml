name: Dentora RAG checks

on:
  push:
    branches:
      - main
      - rag-v1
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python syntax
        run: |
          python -m py_compile backend/main.py backend/rag.py tools/index_library.py

      - name: Extract frontend JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          html = Path("docs/index.html").read_text(encoding="utf-8")
          if "<script>" not in html or "</script>" not in html:
              raise SystemExit("No script block found")
          script = html.split("<script>", 1)[1].split("</script>", 1)[0]
          Path("/tmp/dentora-frontend.js").write_text(script, encoding="utf-8")
          PY

      - name: Test Pinecone ID listing (offline mocks)
        run: python -m unittest discover -s tests -v

      - name: Check frontend JavaScript syntax
        run: node --check /tmp/dentora-frontend.js

      - name: Check Windows RAG wizard syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "tools/dentora_rag_wizard.ps1",
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
