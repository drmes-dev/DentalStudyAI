name: Dentora RAG checks

on:
  push:
    branches:
      - main
      - rag-v1
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Python syntax
        run: |
          python -m py_compile backend/main.py backend/rag.py tools/index_library.py

      - name: Install backend runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Smoke-test FastAPI startup import
        env:
          GEMINI_API_KEY: test-gemini-key
          GROQ_API_KEY: test-groq-key
          DASHSCOPE_API_KEY: test-qwen-key
          PINECONE_API_KEY: ""
          DENTORA_ADMIN_KEY: test-admin-key
          DENTORA_BETA_ACCESS_CODE: test-beta-key
          DENTORA_OWNER_ACCESS_CODE: test-owner-key
        run: |
          cd backend
          python - <<'PY'
          import main
          assert main.app is not None
          routes = {getattr(route, "path", None) for route in main.app.routes}
          required = {"/", "/health", "/beta/verify", "/chat", "/upload-pdf", "/transcribe", "/feedback"}
          missing = required - routes
          if missing:
              raise SystemExit(f"Missing routes: {sorted(missing)}")
          print("FastAPI import/startup smoke test passed")
          PY

      - name: Extract frontend JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          html = Path("docs/index.html").read_text(encoding="utf-8")
          if "<script>" not in html or "</script>" not in html:
              raise SystemExit("No script block found")
          script = html.split("<script>", 1)[1].split("</script>", 1)[0]
          Path("/tmp/dentora-frontend.js").write_text(script, encoding="utf-8")
          PY

      - name: Test Pinecone ID listing (offline mocks)
        run: python -m unittest discover -s tests -v

      - name: Check frontend JavaScript syntax
        run: node --check /tmp/dentora-frontend.js

      - name: Check Windows RAG wizard syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "tools/dentora_rag_wizard.ps1",
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
